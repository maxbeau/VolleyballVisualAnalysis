# --- Trajectory Analysis Settings ----------------------------------
trajectory_analysis:
  # Maximum number of frames to interpolate a missing ball detection.
  max_interp_gap_frames: 0
  # Number of frames to hold the last known ball position.
  hold_ttl_frames: 0
  # Kinematic gating thresholds to reject implausible detections.
  max_speed_px_per_frame: 220.0
  max_accel_px_per_frame2: 800.0
  speed_reset_frame_gap: 10
  static_filter_enable: true
  static_window_frames: 5
  static_min_motion_px: 20.0
  continuity_filter_enable: true
  continuity_window_frames: 6
  continuity_max_error_px: 140.0
  continuity_error_growth_px: 6.0
  ball_diameter_m: 0.215
  size_model_min_samples: 12
  measurement_confidence_floor: 0.05
  viterbi:
    topk: 5
    gap_penalty: 10.0
    start_penalty: 5.0
    max_jump_px: 100.0
    w_conf: 1.0
    w_ar: 2.0
    w_circle: 0.0
    w_border: 0.0
    w_dist: 1.0
    w_size: 0.5
    w_dir: 2.0
    w_accel: 1.0
    dir_max_deg: 60.0
    image_border_margin_px: 10.0
  # --- Output files ---
  output_jsonl: "ball_trajectory.jsonl"
  output_csv: "ball_trajectory.csv"
  output_path_img: "ball_path_birdseye.jpg"
  output_segments_img: "ball_segments_timeline.png"
  height_max_m: 3.2
  segmentation:
    enable: true
    gap_frame_threshold: 12
    smoothing_window_frames: 3
    min_segment_frames: 6
    min_speed_mps: 1.0
    min_heading_speed_mps: 2.5
    speed_jump_abs_mps: 3.0
    speed_jump_mad_multiplier: 2.8
    heading_change_abs_deg: 33.0
    heading_change_mad_multiplier: 2.5
    height_change_abs_m: 0.35
    height_change_mad_multiplier: 2.4
    min_height_for_event_m: 0.35
    require_speed_or_height_for_flip: true
    gap_guard_frames: 4
    vertical_zero_cross_enable: true
    min_vertical_speed_mps: 2.0
    speed_jump_noheight_multiplier: 1.8
    speed_jump_ratio_min: 3.0
    max_event_height_m: 0.55
    combined_score_threshold: 1.2
    merge_event_window_frames: 3
    speed_drop_ratio: 0.55
    annotate_segments: true

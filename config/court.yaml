# --- Court Processing Settings -------------------------------------
court:
  core:
    use_homography: true
    ransac_reproj_thresh: 3.0
    hold_ttl_frames: 8
    min_inlier_ratio: 0.15
    min_inliers: 12
    fb_reproj_thresh: 2.5
    ema_alpha: 0.02
  features:
    feature_max: 220
    roi_expand_ratio: 0.16
    lk_roi_expand_ratio: 0.12
    reseed_min_tracks: 60
    subpix_win: 9
    subpix_stride: 6
  gates:
    max_jump_px: 10.0
    ratio_tolerance: 0.30
    area_tolerance: 0.50
    max_scale_change_per_frame: 0.10
    use_template_score: true
    template_line_px: 8
    template_min_precision: 0.28
    template_stride: 10
    early_motion_gate: true
    early_motion_mad_gray_thr: 5.0
  kalman:
    use_kalman: true
    kalman_q_pos: 1e-2
    kalman_q_vel: 5e-2
    kalman_r_meas: 2.0
    homography_q: 5.0e-4
    homography_r: 2.0
    homography_static_scale: 0.1
    kf_adaptive_from_template: true
    kf_r_api_min: 0.8
    kf_r_api_max: 2.5
    kalman_q_scale_from_motion: true
    kalman_q_scale_lo: 0.5
    kalman_q_scale_hi: 3.0
    motion_md_ref_px: 2.0
  bootstrap:
    enable: true
    window_sec: 2.0
    min_detections: 4
    min_inliers: 3
    ransac_threshold_px: 8.0
    max_span_sec: 3.0
  sentinel:
    enable: true
    warmup_frames: 10
    min_gap_frames: 45
    hold_bad_frames: 6
    inlier_ratio_floor: 0.12
    inlier_ratio_patience: 5
    matches_floor: 25
    matches_patience: 5
    reproj_median_ceiling: 4.0
    reproj_patience: 4
    template_drop: 0.12
    template_patience: 4
    geo_ratio_tol: 0.35
    geo_area_tol: 0.6
    geo_patience: 4
    drift_score_threshold: 3.0
  net:
    enable: true
    measurement_min_confidence: 0.25
    kalman_q: 18.0
    kalman_r: 100.0
    max_height_jump_px: 90.0
    height_bounds_px: [40.0, 420.0]
    fallback_height_px: 90.0
    hold_frames_without_measure: 20
    direction_ema_alpha: 0.1
    label_aliases:
      - "net"
      - "volleyball net"
    court_length_m: 18.0
    court_width_m: 9.0
    physical_height_m: 2.43
    model_process_q_m: 0.001
    model_measure_r_m: 0.02
    px_per_meter_kalman_q: 0.8
    px_per_meter_kalman_r: 25.0
    model_measure_blend: 0.4
    model_measure_gate_px: 64.0
  performance:
    use_roi_downsample: true
    roi_downsample_scale: 0.5
    model_fallback_affine_on_fail: true
  fallback:
    ecc_enable: true
    ecc_min_tpl_precision: 0.24
    ecc_downscale: 0.6
    ecc_gauss_kernel: 5
    ecc_max_iterations: 40
    ecc_epsilon: 1.0e-4
  homography:
    scale_px_per_meter: 20.0
    birdseye_frame_index: 100
    model_width: null
    model_height: null
  outputs:
    output_tracking_jsonl: "court_tracking.jsonl"
    output_meta_json: "court_meta.json"
    output_homography_npy: "homography.npy"
    output_birdseye_jpg: "birdseye.jpg"

# ===================================================================
# Unified Pipeline Configuration for Volleyball Visual Analysis
# ===================================================================

# --- Global Settings -----------------------------------------------
# Defines input video, output directories, and global behavior.
global:
  video_path: "input/input.mp4"
  output_dir: "outputs"
  cache_dir: ".cache"  # Caches live under .cache/videos/<video_stem>_<hash>/...
  # Minimum confidence for an object to be considered in tracking and overlays.
  min_confidence: 0.2
  # Whether to show labels on bounding boxes in the final overlay video.
  show_box_labels: true


# --- Pipeline Steps ------------------------------------------------
# Master switch to enable or disable major stages of the pipeline.
# The pipeline will run these steps in the correct dependency order.
steps:
  detection: true
  court_processing: false
  court_homography: false
  players_tracking: false
  trajectory_analysis: false
  overlay: true


# --- Detection Settings --------------------------------------------
# Configures the object detection backend and target-specific models.
detection:
  # Backend can be 'roboflow' or 'local-yolo'.
  backend: "roboflow"
  # --- Cache Policy ---
  # - cache_first: (Default) Use cache if available, infer missing frames, and update cache.
  # - cache_only: Only use cache. Fail if cache is missing or incomplete.
  # - always_infer: Ignore cache and always run inference, overwriting old cache.
  cache_policy: "cache_first"
  # Roboflow API key is never stored here. Set ROBOFLOW_API_KEY in your environment or .env file.
  # Inference FPS for each detection target.
  infer_fps:
    court: 3
    players: 6
    ball: 12
    actions: 2

  # --- Model IDs (for Roboflow backend) ---
  models_roboflow:
    court: "volleyball-court-lurkn/1"
    players: "players-dataset-fusrb/1"
    ball: "volleyball_v2/3"
    actions: "volleyball-actions/4"

  # --- Model Paths (for local-yolo backend) ---
  models_yolo:
    # Device to use for local YOLO inference (e.g., 'cpu', '0' for GPU 0, 'mps' for Apple Silicon).
    device: "auto"
    # Fallback model if a specific target model is not provided.
    default_model: "weights/yolov8n.pt"
    # Target-specific model paths.
    court: "weights/court_yolov8n.pt"
    players: "weights/players_yolov8n.pt"
    ball: "weights/ball_yolov8n.pt"
    actions: "weights/actions_yolov8n.pt"


# --- Court Processing Settings -------------------------------------
court:
  core:
    use_homography: true
    ransac_reproj_thresh: 3.0
    hold_ttl_frames: 8
    min_inlier_ratio: 0.15
    min_inliers: 12
    fb_reproj_thresh: 2.5
    ema_alpha: 0.02
  features:
    feature_max: 220
    roi_expand_ratio: 0.16
    lk_roi_expand_ratio: 0.12
    reseed_min_tracks: 60
    subpix_win: 9
    subpix_stride: 6
  gates:
    max_jump_px: 10.0
    ratio_tolerance: 0.30
    area_tolerance: 0.50
    max_scale_change_per_frame: 0.10
    use_template_score: true
    template_line_px: 8
    template_min_precision: 0.34
    template_stride: 10
    early_motion_gate: true
    early_motion_mad_gray_thr: 3.0
  kalman:
    use_kalman: true
    kalman_q_pos: 1e-2
    kalman_q_vel: 5e-2
    kalman_r_meas: 2.0
    kf_adaptive_from_template: true
    kf_r_api_min: 0.8
    kf_r_api_max: 2.5
    kalman_q_scale_from_motion: true
    kalman_q_scale_lo: 0.5
    kalman_q_scale_hi: 3.0
    motion_md_ref_px: 2.0
  performance:
    use_roi_downsample: true
    roi_downsample_scale: 0.5
    model_fallback_affine_on_fail: true
  homography:
    scale_px_per_meter: 20.0
    birdseye_frame_index: 100
    model_width: null
    model_height: null
  outputs:
    output_tracking_jsonl: "court_tracking.jsonl"
    output_meta_json: "court_meta.json"
    output_homography_npy: "homography.npy"
    output_birdseye_jpg: "birdseye.jpg"


# --- Player Tracking Settings (OC-SORT) ----------------------------
players:
  # Detection confidence threshold to consider a player for tracking.
  track_thresh: 0.35
  # IoU threshold for associating detections with existing tracks.
  match_iou: 0.8
  # Maximum number of frames to keep a track alive without a new detection.
  max_age: 50
  # Minimum number of hits (associated detections) to consider a track valid.
  min_hits: 3
  # Maximum number of frames to process for player tracking. null means no limit.
  max_frames: null
  # Number of frames to hold a player box for visualization after it disappears.
  hold_ttl_frames: 8
  # Whether to draw player boxes on the overlay.
  show_box: true
  # Filename for the output tracks file.
  output_tracks_jsonl: "players_tracks.jsonl"


# --- Trajectory Analysis Settings ----------------------------------
trajectory_analysis:
  # Maximum number of frames to interpolate a missing ball detection.
  max_interp_gap_frames: 10
  # Number of frames to hold the last known ball position.
  hold_ttl_frames: 4


# --- Overlay Settings ----------------------------------------------
overlay:
  output_video_path: "full_overlay.mp4"
  codec: "mp4v"

  ball:
    selection:
      method: "continuity"
      continuity:
        max_jump_px: 100.0
        search_topk: 3
        reseed_misses: 5
        reseed_lookahead: 5
        reseed_min_move_px: 10.0
        reseed_min_conf: 0.1
        reseed_max_ar_dev: 1.5
        retro_min_seg_len: 3
        retro_min_seg_move_px: 20.0
      viterbi:
        topk: 5
        gap_penalty: 10.0
        start_penalty: 5.0
        w_conf: 1.0
        w_ar: 2.0
        w_circle: 0.0
        w_border: 0.0
        w_dist: 1.0
        w_size: 0.5
        w_dir: 2.0
        w_accel: 1.0
        dir_max_deg: 60.0
        image_border_margin_px: 10.0
    visualization:
      hold_mode: true
      hold_ttl_frames: 4
      tail_enable: true
      tail_max_age_frames: 16
      tail_thickness: 2
      tail_base_alpha: 0.7
      tail_color: [255, 250, 250]
      show_near_box_tags: true
    filter:
      exclude_frames: ""
      min_aspect_ratio: 0.5
      max_aspect_ratio: 2.0
      ar_soft_alpha: 3.0
      kinematic_filter_enable: false
    kinematic_filter:
      max_speed_px_per_s: 3000.0
      max_accel_px_per_s2: 6000.0
      max_dir_change_deg: 45.0
      max_size_change_frac_per_s: 10.0
      static_filter_enable: false
      static_min_speed_px_per_s: 20.0
      static_min_frames: 4
      enable_speed_gate: true
      enable_accel_gate: true
      enable_dir_gate: true
      enable_size_gate: true
      dyn_enable: true
      dyn_min_mult: 0.5
      dyn_max_mult: 2.0
    smoothing:
      enable: false
      obs_gate_chisq_thresh: 9.0
      obs_gate_use_conf: true
      gravity_pps2: 350.0
    evaluation:
      nonball_frames: ""

  court:
    enable: true
    method: "timeseries"
    color: [255, 255, 255]
    thickness: 2
    center_color: [200, 200, 200]
    attack_color: [200, 200, 200]
    roi_filter: true
    show_diag: false
    mini_enable: true
    mini_show_teams: true
    mini_orient_mode: "template"
    mini_placement: "top-right"
    mini_scale: 0.24
    mini_show_label: true
    mini_draw_poly: true

  players:
    hold_ttl_frames: 8
    show_box: true

  actions:
    show_box: true
    clips_jsonl: "action_clips.jsonl"

  teams:
    team_a_name: "TeamA"
    team_b_name: "TeamB"
    action_min_conf: 0.25
    serve_cooldown_frames: 20
    bind_strategy: "earliest"
    team_a_side: "auto"
    bind_window_frames: 240
    bind_block_to_serve: true
    bind_set_to_receive: true
    bind_block_oppose_spike: true
    bind_block_oppose_spike_window_frames: 24
    bind_block_oppose_set: true
    bind_block_oppose_set_window_frames: 48
    bind_rally_max_gap_frames: 600
